name: Deploy

on:
  push:
    branches: [main, develop]

# Never cancel a running deployment: a half-finished promotion is worse than a
# queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    # Holds the Vercel credentials as environment secrets. Both branches share
    # it; the production/preview split is decided by VERCEL_TARGET below.
    environment:
      name: deploy
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # main ships to production, develop ships to a preview deployment.
      VERCEL_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The build runs on Vercel rather than here. scripts/generate-env.mjs
      # expects the host to inject API_URL, Supabase and Firebase keys as real
      # environment variables, which Vercel does natively for the target being
      # deployed. Building locally with `vercel build` does not forward them to
      # the build command, so the deploy is the only build step.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --yes --target=$VERCEL_TARGET --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`${{ github.ref_name }}\` to $VERCEL_TARGET: $url" >> "$GITHUB_STEP_SUMMARY"
