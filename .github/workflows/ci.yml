name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build and the tests both run scripts/generate-env.mjs, which fails
      # when required keys are missing. Real secrets are not needed to compile
      # or to run unit tests, so CI uses the documented placeholders.
      - name: Create placeholder environment
        run: cp .env.example .env

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build
