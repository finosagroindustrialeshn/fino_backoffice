<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  (onShow)="resetForm()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '640px': '92vw' }"
  header="Nueva ruta"
  [dismissableMask]="true"
>
  <p class="mb-5 text-sm text-ink-soft">
    La ruta se crea vacía. Al guardarla se abre su detalle, que es donde se
    agregan los clientes a visitar.
  </p>

  @if (error(); as message) {
    <div
      role="alert"
      class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
    >
      {{ message }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
    <div class="flex flex-col gap-1.5">
      <label
        for="route-date"
        class="text-xs font-semibold uppercase tracking-wide text-ink-soft"
      >
        Fecha
      </label>
      <p-datepicker
        inputId="route-date"
        formControlName="date"
        dateFormat="dd/mm/yy"
        [readonlyInput]="true"
        [showIcon]="true"
        appendTo="body"
        styleClass="w-full"
      />
      @if (form.controls.date.touched && form.controls.date.invalid) {
        <span class="text-xs text-red-600" role="alert">
          La fecha es obligatoria.
        </span>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label
        for="route-seller"
        class="text-xs font-semibold uppercase tracking-wide text-ink-soft"
      >
        Vendedor
      </label>
      <p-select
        inputId="route-seller"
        formControlName="sellerId"
        [options]="sellers()"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        appendTo="body"
        placeholder="Se asigna al usuario actual"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label
        for="route-zone"
        class="text-xs font-semibold uppercase tracking-wide text-ink-soft"
      >
        Zona
      </label>
      <p-select
        inputId="route-zone"
        formControlName="zoneId"
        [options]="zones()"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        appendTo="body"
        placeholder="Sin zona"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label
        for="route-notes"
        class="text-xs font-semibold uppercase tracking-wide text-ink-soft"
      >
        Notas
      </label>
      <textarea
        pTextarea
        id="route-notes"
        formControlName="notes"
        rows="3"
        class="w-full"
      ></textarea>
    </div>

    <div class="flex items-center justify-end gap-2">
      <p-button
        type="button"
        label="Cancelar"
        severity="secondary"
        [text]="true"
        (onClick)="close()"
      />
      <p-button type="submit" label="Crear ruta" [loading]="submitting()" />
    </div>
  </form>
</p-dialog>
