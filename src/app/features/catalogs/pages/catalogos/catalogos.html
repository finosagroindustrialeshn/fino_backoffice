<div class="flex flex-col gap-6">
  <header class="flex flex-col gap-1">
    <h2 class="font-heading text-2xl font-bold text-ink">{{ activeTab().title }}</h2>
    <p class="text-sm text-ink-soft">{{ activeTab().description }}</p>
  </header>

  <nav
    class="flex flex-wrap gap-1 border-b border-ink/10"
    aria-label="Secciones de catálogos"
  >
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="border-brand text-ink"
        class="border-b-2 border-transparent px-3 py-2.5 text-sm font-medium text-ink-soft transition-colors hover:text-ink"
      >
        {{ tab.tabLabel }}
      </a>
    }
  </nav>

  <router-outlet />
</div>
