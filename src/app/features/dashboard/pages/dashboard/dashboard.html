<div class="flex flex-col gap-6">
  <!-- Stat tiles -->
  <section
    class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"
    aria-label="Resumen del día"
  >
    @for (stat of stats; track stat.label) {
      <article
        class="flex items-center gap-4 rounded-2xl border border-ink/10 bg-white p-5"
      >
        <span
          class="flex h-12 w-12 items-center justify-center rounded-xl bg-brand-mist text-brand"
          aria-hidden="true"
        >
          <i [class]="stat.icon" class="text-xl"></i>
        </span>
        <div class="flex flex-col">
          <span class="text-sm text-ink-soft">{{ stat.label }}</span>
          <span class="font-heading text-2xl font-bold text-ink">{{ stat.value }}</span>
        </div>
      </article>
    }
  </section>

  <!-- PrimeNG showcase: confirms the brand green theme is wired up -->
  <p-card>
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <h2 class="font-heading text-xl font-bold text-ink">
          PrimeNG + tema Fino
        </h2>
        <p class="text-ink-soft">
          Componentes de PrimeNG tomando la paleta verde de la marca a través
          del preset custom.
        </p>
      </div>
      <div class="flex flex-wrap gap-3">
        <p-button label="Acción primaria" icon="pi pi-check" />
        <p-button label="Secundaria" severity="secondary" [outlined]="true" />
        <p-button label="Sin estilo" [text]="true" />
      </div>
    </div>
  </p-card>
</div>
