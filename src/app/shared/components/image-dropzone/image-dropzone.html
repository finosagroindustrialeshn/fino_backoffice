<input
  type="file"
  id="image-dropzone-input"
  accept="image/jpeg,image/png,image/webp"
  aria-label="Imagen"
  (change)="onFileInput($event)"
  class="peer sr-only"
/>

@if (preview(); as src) {
  <div class="group relative overflow-hidden rounded-xl border border-ink/10">
    <img [src]="src" alt="Vista previa de la imagen" class="h-48 w-full object-cover" />
    <div
      class="absolute inset-0 flex items-center justify-center gap-2 bg-ink/50 opacity-0 transition-opacity group-hover:opacity-100 peer-focus-visible:opacity-100"
    >
      <label
        for="image-dropzone-input"
        class="cursor-pointer rounded-lg bg-white px-3 py-1.5 text-sm font-medium text-ink shadow-sm hover:bg-white/90"
      >
        Cambiar
      </label>
      <button
        type="button"
        class="rounded-lg bg-white px-3 py-1.5 text-sm font-medium text-red-600 shadow-sm hover:bg-white/90"
        (click)="clear()"
      >
        Quitar
      </button>
    </div>
  </div>
} @else {
  <label
    for="image-dropzone-input"
    class="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-ink/25 bg-ink/[0.02] px-6 py-10 text-center transition-colors hover:border-primary hover:bg-primary/5 peer-focus-visible:border-primary peer-focus-visible:ring-2 peer-focus-visible:ring-primary/40"
    [class.ring-2]="isDragging()"
    [class.ring-primary]="isDragging()"
    [class.ring-offset-2]="isDragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <i class="pi pi-cloud-upload text-3xl text-ink-soft" aria-hidden="true"></i>
    <span class="text-sm font-medium text-ink">
      Arrastrá una imagen o hacé clic para elegir
    </span>
    <span class="text-xs text-ink-soft">JPG, PNG o WEBP · máx 5 MB</span>
  </label>
}

<!-- URL alternative -->
<div class="mt-2 flex items-center gap-2">
  <input
    #urlInput
    type="url"
    inputmode="url"
    placeholder="o pegá el enlace de una imagen (https://…)"
    aria-label="Enlace de una imagen"
    class="w-full rounded-lg border border-ink/15 px-3 py-2 text-sm text-ink placeholder:text-ink-soft focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
    (keydown.enter)="$event.preventDefault(); applyUrl(urlInput.value)"
  />
  <button
    type="button"
    class="shrink-0 rounded-lg border border-ink/15 px-3 py-2 text-sm font-medium text-ink hover:bg-ink/5"
    (click)="applyUrl(urlInput.value)"
  >
    Usar
  </button>
</div>
