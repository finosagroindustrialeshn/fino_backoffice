<input
  type="file"
  [id]="inputId"
  [accept]="accept()"
  [attr.aria-label]="label()"
  (change)="onFileInput($event)"
  class="peer sr-only"
/>

@if (selection(); as file) {
  <div
    class="flex flex-col items-center justify-center gap-3 rounded-xl border border-ink/10 bg-ink/[0.02] px-4 text-center"
    [class]="filledShape()"
  >
    <i class="pi pi-file text-3xl text-ink-soft" aria-hidden="true"></i>

    @if (file.href; as href) {
      <a
        [href]="href"
        target="_blank"
        rel="noopener"
        [title]="file.label"
        class="line-clamp-2 max-w-full break-all text-sm font-medium text-ink underline-offset-2 hover:underline"
      >
        {{ file.label }}
      </a>
    } @else {
      <span
        [title]="file.label"
        class="line-clamp-2 max-w-full break-all text-sm font-medium text-ink"
      >
        {{ file.label }}
      </span>
    }

    <div class="flex flex-wrap items-center justify-center gap-2">
      <label
        [for]="inputId"
        class="cursor-pointer rounded-lg border border-ink/15 px-3 py-1.5 text-sm font-medium text-ink hover:bg-ink/5 peer-focus-visible:ring-2 peer-focus-visible:ring-primary/40"
      >
        Cambiar
      </label>
      <button
        type="button"
        class="rounded-lg border border-ink/15 px-3 py-1.5 text-sm font-medium text-red-600 hover:bg-red-50"
        (click)="clear()"
      >
        Quitar
      </button>
    </div>
  </div>
} @else {
  <label
    [for]="inputId"
    class="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-ink/25 bg-ink/[0.02] px-6 text-center transition-colors hover:border-primary hover:bg-primary/5 peer-focus-visible:border-primary peer-focus-visible:ring-2 peer-focus-visible:ring-primary/40"
    [class]="emptyShape()"
    [class.ring-2]="isDragging()"
    [class.ring-primary]="isDragging()"
    [class.ring-offset-2]="isDragging()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <i class="pi pi-cloud-upload text-3xl text-ink-soft" aria-hidden="true"></i>
    <span class="text-sm font-medium text-ink">
      Arrastrá un archivo o hacé clic para elegir
    </span>
    @if (hint(); as text) {
      <span class="text-xs text-ink-soft">{{ text }}</span>
    }
  </label>
}

<!-- URL alternative -->
<div class="mt-2 flex items-center gap-2">
  <input
    #urlInput
    type="url"
    inputmode="url"
    placeholder="o pegá el enlace del archivo (https://…)"
    [attr.aria-label]="label() + ' por enlace'"
    class="w-full rounded-lg border border-ink/15 px-3 py-2 text-sm text-ink placeholder:text-ink-soft focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
    (keydown.enter)="$event.preventDefault(); applyUrl(urlInput.value)"
  />
  <button
    type="button"
    class="shrink-0 rounded-lg border border-ink/15 px-3 py-2 text-sm font-medium text-ink hover:bg-ink/5"
    (click)="applyUrl(urlInput.value)"
  >
    Usar
  </button>
</div>
