<header
  class="flex h-[72px] shrink-0 items-center justify-between border-b border-ink/10 bg-cream/80 px-7 backdrop-blur-sm"
>
  <h1 class="font-heading text-2xl font-extrabold tracking-tight text-ink">
    {{ title() }}
  </h1>

  <div class="flex items-center gap-2">
    <button
      type="button"
      aria-label="Buscar"
      class="flex h-10 w-10 items-center justify-center rounded-full text-ink-soft transition-colors hover:bg-white"
    >
      <i class="pi pi-search text-base" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      aria-label="Notificaciones"
      class="flex h-10 w-10 items-center justify-center rounded-full text-ink-soft transition-colors hover:bg-white"
    >
      <i class="pi pi-bell text-base" aria-hidden="true"></i>
    </button>
  </div>
</header>
